name: Daily snapshot

on:
  schedule:
    # 14:00 UTC = 6am PST / 7am PDT
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Replace today's rows if they already exist"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect listings
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: python -m tracker.collect ${{ inputs.force && '--force' || '' }}

      - name: Rebuild dashboard data
        if: always()
        run: python -m tracker.metrics

      - name: Commit snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet -- data; then
            echo "No new data to commit"
            exit 0
          fi
          git commit -m "data: snapshot $(date -u +%F)"
          git pull --rebase
          git push

      # GitHub disables cron workflows after 60 days without human commits;
      # re-enabling via the API on every run resets that clock.
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/snapshot.yml/enable"
